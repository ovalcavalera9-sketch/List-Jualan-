<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vin Store</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f4f6f8;
      color: #222;
    }

    header {
      background: #111827;
      color: white;
      padding: 15px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo {
      font-size: 21px;
      font-weight: bold;
    }

    #search {
      flex: 1;
      padding: 10px;
      border: 0;
      border-radius: 8px;
    }

    .cart-btn {
      background: #2563eb;
      border: 0;
      color: white;
      padding: 10px;
      border-radius: 8px;
    }

    .hero {
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      color: white;
      text-align: center;
      padding: 45px 20px;
    }

    .hero h1 {
      font-size: 30px;
      margin-bottom: 8px;
    }

    .categories {
      padding: 18px;
      display: flex;
      gap: 8px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .category {
      padding: 9px 15px;
      border: 0;
      border-radius: 20px;
      background: white;
      box-shadow: 0 2px 8px #ddd;
    }

    .category.active {
      background: #2563eb;
      color: white;
    }

    .products {
      max-width: 1100px;
      margin: auto;
      padding: 15px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 15px;
    }

    .product {
      background: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 3px 10px #ddd;
    }

    .product img {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
    }

    .info {
      padding: 14px;
    }

    .info h3 {
      margin-bottom: 8px;
    }

    .desc {
      color: #666;
      font-size: 13px;
      min-height: 35px;
    }

    .price {
      color: #2563eb;
      font-size: 19px;
      font-weight: bold;
      margin: 10px 0;
    }

    .add {
      width: 100%;
      border: 0;
      background: #2563eb;
      color: white;
      padding: 11px;
      border-radius: 8px;
    }

    .box {
      max-width: 700px;
      margin: 20px auto;
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 3px 10px #ddd;
    }

    .cart-item {
      padding: 12px 0;
      border-bottom: 1px solid #eee;
      display: flex;
      justify-content: space-between;
      gap: 10px;
    }

    .delete {
      background: #ef4444;
      color: white;
      border: 0;
      padding: 6px 9px;
      border-radius: 6px;
    }

    input, textarea {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      border: 1px solid #ddd;
      border-radius: 8px;
    }

    textarea {
      height: 80px;
      resize: vertical;
    }

    .pay-option {
      display: block;
      padding: 12px;
      margin-top: 8px;
      border: 1px solid #ddd;
      border-radius: 8px;
    }

    .checkout {
      width: 100%;
      margin-top: 15px;
      padding: 14px;
      background: #16a34a;
      color: white;
      border: 0;
      border-radius: 8px;
      font-size: 17px;
      font-weight: bold;
    }

    @media(max-width:600px) {
      header {
        flex-wrap: wrap;
      }

      #search {
        flex-basis: 100%;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="logo">🛒 Vin Store</div>

  <input
    id="search"
    type="text"
    placeholder="Cari produk..."
    oninput="searchProducts()"
  >

  <button class="cart-btn" onclick="goCart()">
    🛒 <span id="count">0</span>
  </button>
</header>

<section class="hero">
  <h1>Belanja Mudah & Cepat 🚀</h1>
  <p>Selamat datang di Vin Store</p>
</section>

<div class="categories">
  <button class="category active" onclick="filter('Semua', this)">Semua</button>
  <button class="category" onclick="filter('Web', this)">🌐 Web</button>
  <button class="category" onclick="filter('Suntik', this)">📱 Suntik</button>
  <button class="category" onclick="filter('Nokos', this)">📞 Nokos</button>
</div>

<div class="products" id="products"></div>

<div class="box" id="cart">
  <h2>🛒 Keranjang</h2>
  <div id="cartItems"></div>

  <h3 style="margin-top:15px;">
    Total: <span id="total">Rp0</span>
  </h3>
</div>

<div class="box">
  <h2>📦 Checkout</h2>

  <input id="name" placeholder="Nama kamu">

  <input id="phone" placeholder="Nomor WhatsApp">

  <textarea id="note" placeholder="Catatan pesanan"></textarea>

  <p style="margin-top:15px;font-weight:bold;">
    Pilih pembayaran:
  </p>

  <label class="pay-option">
    <input type="radio" name="payment" value="DANA">
    DANA
  </label>

  <label class="pay-option">
    <input type="radio" name="payment" value="GoPay">
    GoPay
  </label>

  <label class="pay-option">
    <input type="radio" name="payment" value="OVO">
    OVO
  </label>

  <label class="pay-option">
    <input type="radio" name="payment" value="QRIS">
    QRIS
  </label>

  <button class="checkout" onclick="checkout()">
    💳 LANJUT KE PEMBAYARAN
  </button>
</div>

<script>

const products = [
  {
    name: "Murid Web",
    price: 5000,
    category: "Web",
    image: "https://picsum.photos/600/600?random=11",
    desc: "Bisa buat web kamu sendiri."
  },
  {
    name: "Murid Suntik",
    price: 5000,
    category: "Suntik",
    image: "https://picsum.photos/600/600?random=12",
    desc: "Belajar jualan layanan sosmed."
  },
  {
    name: "Murid Nokos",
    price: 5000,
    category: "Nokos",
    image: "https://picsum.photos/600/600?random=13",
    desc: "Belajar jualan nokos."
  }
];

let cart = [];
let currentFilter = "Semua";

function rupiah(n) {
  return "Rp" + n.toLocaleString("id-ID");
}

function showProducts(list) {

  const box = document.getElementById("products");

  box.innerHTML = "";

  list.forEach((p) => {

    const index = products.indexOf(p);

    box.innerHTML += `
      <div class="product">

        <img src="${p.image}" alt="${p.name}">

        <div class="info">

          <h3>${p.name}</h3>

          <div class="desc">
            ${p.desc}
          </div>

          <div class="price">
            ${rupiah(p.price)}
          </div>

          <button class="add" onclick="add(${index})">
            + Tambah
          </button>

        </div>

      </div>
    `;
  });
}

function add(index) {

  const product = products[index];

  const existing =
    cart.find(x => x.name === product.name);

  if (existing) {
    existing.qty++;
  } else {
    cart.push({
      name: product.name,
      price: product.price,
      qty: 1
    });
  }

  updateCart();
}

function remove(index) {

  cart.splice(index, 1);

  updateCart();
}

function updateCart() {

  const box = document.getElementById("cartItems");

  let total = 0;
  let count = 0;

  box.innerHTML = "";

  if (cart.length === 0) {

    box.innerHTML =
      "<p style='padding:15px 0;color:#777'>Keranjang kosong.</p>";

  }

  cart.forEach((item, index) => {

    const subtotal = item.price * item.qty;

    total += subtotal;
    count += item.qty;

    box.innerHTML += `
      <div class="cart-item">

        <div>
          <b>${item.name}</b><br>
          ${item.qty} × ${rupiah(item.price)}
        </div>

        <div>
          <b>${rupiah(subtotal)}</b><br>

          <button
            class="delete"
            onclick="remove(${index})"
          >
            Hapus
          </button>
        </div>

      </div>
    `;
  });

  document.getElementById("total").textContent =
    rupiah(total);

  document.getElementById("count").textContent =
    count;
}

function filter(category, button) {

  currentFilter = category;

  document.querySelectorAll(".category")
    .forEach(x => x.classList.remove("active"));

  button.classList.add("active");

  if (category === "Semua") {
    showProducts(products);
  } else {
    showProducts(
      products.filter(x => x.category === category)
    );
  }
}

function searchProducts() {

  const keyword =
    document.getElementById("search").value.toLowerCase();

  let result = products.filter(x =>
    x.name.toLowerCase().includes(keyword)
  );

  if (currentFilter !== "Semua") {

    result = result.filter(
      x => x.category === currentFilter
    );

  }

  showProducts(result);
}

function goCart() {

  document.getElementById("cart")
    .scrollIntoView({
      behavior: "smooth"
    });

}

function checkout() {

  if (cart.length === 0) {
    alert("Keranjang masih kosong!");
    return;
  }

  const name =
    document.getElementById("name").value.trim();

  const phone =
    document.getElementById("phone").value.trim();

  const note =
    document.getElementById("note").value.trim();

  const payment =
    document.querySelector(
      'input[name="payment"]:checked'
    );

  if (!name) {
    alert("Isi nama terlebih dahulu!");
    return;
  }

  if (!phone) {
    alert("Isi nomor WhatsApp terlebih dahulu!");
    return;
  }

  if (!payment) {
    alert("Pilih metode pembayaran!");
    return;
  }

  let total = 0;

  const items = cart.map(item => {

    const subtotal =
      item.price * item.qty;

    total += subtotal;

    return {
      name: item.name,
      price: item.price,
      qty: item.qty,
      subtotal: subtotal
    };

  });

  const order = {
    name: name,
    phone: phone,
    note: note,
    payment: payment.value,
    items: items,
    total: total,
    date: new Date().toLocaleString("id-ID"),
    status: "Menunggu Pembayaran"
  };

  localStorage.setItem(
    "vinStoreOrder",
    JSON.stringify(order)
  );

  window.location.href = "payment.html";
}

showProducts(products);
updateCart();

</script>

</body>
</html>
