<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vin Store</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif
}

body{
  background:
    radial-gradient(circle at 15% 20%,rgba(0,255,255,.18),transparent 30%),
    radial-gradient(circle at 85% 70%,rgba(0,255,255,.15),transparent 30%),
    #050505;
  color:#fff;
}

header{
  background:#050505;
  color:white;
  padding:15px;
  display:flex;
  align-items:center;
  gap:12px;
  position:sticky;
  top:0;
  z-index:10;
  box-shadow:0 0 20px rgba(0,255,255,.35);
}

.logo{
  font-size:21px;
  font-weight:bold;
  text-shadow:0 0 10px cyan;
}

#search{
  flex:1;
  padding:10px;
  border:1px solid rgba(0,255,255,.4);
  border-radius:8px;
  background:#111;
  color:white;
  outline:none;
}

#search::placeholder{
  color:#aaa;
}

.cart-btn{
  background:#00e5ff;
  border:0;
  color:#000;
  padding:10px;
  border-radius:8px;
  font-weight:bold;
  box-shadow:0 0 15px rgba(0,255,255,.5);
}

.hero{
  background:
    radial-gradient(circle at center,rgba(0,255,255,.25),transparent 50%),
    linear-gradient(135deg,#020617,#00191f);
  color:white;
  text-align:center;
  padding:45px 20px;
  border-bottom:1px solid rgba(0,255,255,.3);
}

.hero h1{
  font-size:30px;
  margin-bottom:8px;
  text-shadow:0 0 15px cyan;
}

.hero p{
  color:#bffcff;
}

.categories{
  padding:18px;
  display:flex;
  gap:8px;
  justify-content:center;
  flex-wrap:wrap;
}

.category{
  padding:9px 15px;
  border:1px solid rgba(0,255,255,.3);
  border-radius:20px;
  background:#0b0b0b;
  color:white;
  box-shadow:0 0 10px rgba(0,255,255,.1);
}
