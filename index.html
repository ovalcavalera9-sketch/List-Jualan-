<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Vin Store</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#050505;
  color:#fff;
}

/* HEADER */
header{
  background:#0b0b0b;
  border-bottom:1px solid #00eaff;
  padding:15px;
  display:flex;
  align-items:center;
  gap:12px;
  position:sticky;
  top:0;
  z-index:10;
  box-shadow:0 0 15px rgba(0,234,255,.15);
}

.logo{
  font-size:21px;
  font-weight:bold;
  color:#00eaff;
  white-space:nowrap;
}

#search{
  flex:1;
  padding:11px;
  background:#111;
  color:white;
  border:1px solid #222;
  border-radius:8px;
  outline:none;
}

#search:focus{
  border-color:#00eaff;
  box-shadow:0 0 8px rgba(0,234,255,.3);
}

.cart-btn{
  background:#00eaff;
  color:#000;
  border:0;
  padding:10px 14px;
  border-radius:8px;
  font-weight:bold;
  cursor:pointer;
}

/* HERO */
.hero{
  background:
    radial-gradient(circle at top,#063d45 0%,#050505 55%);
  color:white;
  text-align:center;
  padding:55px 20px;
  border-bottom:1px solid #111;
}

.hero h1{
  font-size:30px;
  margin-bottom:10px;
  color:#00eaff;
  text-shadow:0 0 15px rgba(0,234,255,.5);
}

.hero p{
  color:#bbb;
}

/* CATEGORY */
.categories{
  padding:20px 15px;
  display:flex;
  gap:8px;
  justify-content:center;
  flex-wrap:wrap;
}

.category{
  padding:9px 16px;
  border:1px solid #333;
  border-radius:20px;
  background:#111;
  color:#fff;
  cursor:pointer;
  transition:.2s;
}

.category:hover{
  border-color:#00eaff;
  color:#00eaff;
}

.category.active{
  background:#00eaff;
  color:#000;
  border-color:#00eaff;
  box-shadow:0 0 12px rgba(0,234,255,.35);
}

/* PRODUCTS */
.products{
  max-width:1100px;
  margin:auto;
  padding:15px;
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:15px;
}

.product{
  background:#0d0d0d;
  border:1px solid #222;
  border-radius:12px;
  overflow:hidden;
  box-shadow:0 3px 15px rgba(0,0,0,.5);
  transition:.2s;
}

.product:hover{
  transform:translateY(-3px);
  border-color:#00eaff;
  box-shadow:0 0 15px rgba(0,234,255,.2);
}

.product img{
  width:100%;
  aspect-ratio:1;
  object-fit:cover;
  display:block;
}

.info{
  padding:14px;
}

.info h3{
  margin-bottom:8px;
  color:#fff;
}

.desc{
  color:#999;
  font-size:13px;
  min-height:35px;
}

.price{
  color:#00eaff;
  font-size:19px;
  font-weight:bold;
  margin:10px 0;
}

.add{
  width:100%;
  border:0;
  background:#00eaff;
  color:#000;
  padding:11px;
  border-radius:8px;
  font-weight:bold;
  cursor:pointer;
  transition:.2s;
}

.add:hover{
  box-shadow:0 0 12px rgba(0,234,255,.5);
}

/* BOX */
.box{
  max-width:700px;
  margin:20px auto;
  background:#0d0d0d;
  border:1px solid #222;
  padding:20px;
  border-radius:12px;
  box-shadow:0 3px 15px rgba(0,0,0,.5);
}

.box h2{
  color:#00eaff;
}

/* CART */
.cart-item{
  padding:12px 0;
  border-bottom:1px solid #222;
  display:flex;
  justify-content:space-between;
  gap:10px;
}

.cart-item b{
  color:#fff;
}

.delete{
  background:#ef4444;
  color:white;
  border:0;
  padding:6px 9px;
  border-radius:6px;
  cursor:pointer;
}

/* FORM */
input,
textarea{
  width:100%;
  padding:12px;
  margin-top:10px;
  background:#111;
  color:white;
  border:1px solid #333;
  border-radius:8px;
  outline:none;
}

input:focus,
textarea:focus{
  border-color:#00eaff;
  box-shadow:0 0 7px rgba(0,234,255,.2);
}

textarea{
  height:80px;
  resize:vertical;
}

.pay-option{
  display:block;
  padding:12px;
  margin-top:8px;
  background:#111;
  border:1px solid #333;
  border-radius:8px;
  cursor:pointer;
}

.pay-option:hover{
  border-color:#00eaff;
}

.pay-option input{
  width:auto;
  margin:0 8px 0 0;
}

/* CHECKOUT */
.checkout{
  width:100%;
  margin-top:15px;
  padding:14px;
  background:#00eaff;
  color:#000;
  border:0;
  border-radius:8px;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
}

.checkout:hover{
  box-shadow:0 0 15px rgba(0,234,255,.5);
}

/* MOBILE */
@media(max-width:600px){

  header{
    flex-wrap:wrap;
  }

  .logo{
    width:100%;
    text-align:center;
  }

  #search{
    flex-basis:calc(100% - 60px);
  }

  .cart-btn{
    flex:1;
  }

  .hero h1{
    font-size:25px;
  }

  .products{
    grid-template-columns:repeat(2,1fr);
    gap:10px;
    padding:10px;
  }

  .info{
    padding:10px;
  }

  .info h3{
    font-size:16px;
  }

  .price{
    font-size:17px;
  }

  .box{
    margin:15px 10px;
  }
}
</style>
</head>

<body>

<header>

  <div class="logo">
    🛒 Vin Store
  </div>

  <input
    id="search"
    type="text"
    placeholder="Cari produk..."
    oninput="searchProducts()"
  >

  <button class="cart-btn" onclick="goCart()">
    🛒 <span id="count">0</span>
  </button>

</header>


<section class="hero">

  <h1>Vin Store ⚡</h1>

  <p>
    Belanja mudah, cepat, dan praktis
  </p>

</section>


<div class="categories">

  <button
    class="category active"
    onclick="filter('Semua',this)"
  >
    Semua
  </button>

  <button
    class="category"
    onclick="filter('Web',this)"
  >
    🌐 Web
  </button>

  <button
    class="category"
    onclick="filter('Suntik',this)"
  >
    📱 Suntik
  </button>

  <button
    class="category"
    onclick="filter('Nokos',this)"
  >
    📞 Nokos
  </button>

</div>


<div
  class="products"
  id="products"
></div>


<div
  class="box"
  id="cart"
>

  <h2>🛒 Keranjang</h2>

  <div id="cartItems"></div>

  <h3 style="margin-top:15px">
    Total:
    <span
      id="total"
      style="color:#00eaff"
    >
      Rp0
    </span>
  </h3>

</div>


<div
  class="box"
  id="checkoutBox"
>

  <h2>📦 Checkout</h2>

  <input
    id="name"
    placeholder="Nama kamu"
  >

  <input
    id="phone"
    placeholder="Nomor WhatsApp"
    inputmode="numeric"
  >

  <textarea
    id="note"
    placeholder="Catatan pesanan"
  ></textarea>


  <p
    style="margin-top:15px;font-weight:bold"
  >
    Pilih pembayaran:
  </p>


  <label class="pay-option">

    <input
      type="radio"
      name="payment"
      value="DANA"
    >

    DANA

  </label>


  <label class="pay-option">

    <input
      type="radio"
      name="payment"
      value="GoPay"
    >

    GoPay

  </label>


  <label class="pay-option">

    <input
      type="radio"
      name="payment"
      value="OVO"
    >

    OVO

  </label>


  <label class="pay-option">

    <input
      type="radio"
      name="payment"
      value="QRIS"
    >

    QRIS

  </label>


  <button
    class="checkout"
    onclick="checkout()"
  >
    💳 LANJUT KE PEMBAYARAN
  </button>

</div>


<script>

const products = [

  {
    name:"Murid Web",
    price:5000,
    category:"Web",
    image:"https://picsum.photos/600/600?random=11",
    desc:"Bisa buat web kamu sendiri."
  },

  {
    name:"Murid Suntik",
    price:5000,
    category:"Suntik",
    image:"https://picsum.photos/600/600?random=12",
    desc:"Belajar jualan layanan sosmed."
  },

  {
    name:"Murid Nokos",
    price:5000,
    category:"Nokos",
    image:"https://picsum.photos/600/600?random=13",
    desc:"Belajar jualan nokos."
  }

];


let cart = [];

let currentFilter = "Semua";


function rupiah(n){

  return "Rp" + n.toLocaleString("id-ID");

}


function showProducts(list){

  const box =
    document.getElementById("products");

  box.innerHTML = "";


  if(list.length === 0){

    box.innerHTML = `
      <div
        style="
          grid-column:1/-1;
          text-align:center;
          padding:30px;
          color:#777;
        "
      >
        Produk tidak ditemukan.
      </div>
    `;

    return;

  }


  list.forEach(p => {

    const index =
      products.indexOf(p);


    box.innerHTML += `

      <div class="product">

        <img
          src="${p.image}"
          alt="${p.name}"
        >

        <div class="info">

          <h3>
            ${p.name}
          </h3>

          <div class="desc">
            ${p.desc}
          </div>

          <div class="price">
            ${rupiah(p.price)}
          </div>

          <button
            class="add"
            onclick="add(${index})"
          >
            + Tambah
          </button>

        </div>

      </div>

    `;

  });

}


function add(index){

  const product =
    products[index];


  const existing =
    cart.find(
      x => x.name === product.name
    );


  if(existing){

    existing.qty++;

  }else{

    cart.push({

      name:product.name,
      price:product.price,
      qty:1

    });

  }


  updateCart();


  document
    .getElementById("checkoutBox")
    .scrollIntoView({

      behavior:"smooth",
      block:"start"

    });

}


function remove(index){

  cart.splice(index,1);

  updateCart();

}


function updateCart(){

  const box =
    document.getElementById("cartItems");


  let total = 0;

  let count = 0;


  box.innerHTML = "";


  if(cart.length === 0){

    box.innerHTML = `
      <p
        style="
          padding:15px 0;
          color:#777
        "
      >
        Keranjang kosong.
      </p>
    `;

  }


  cart.forEach((item,index) => {

    const subtotal =
      item.price * item.qty;


    total += subtotal;

    count += item.qty;


    box.innerHTML += `

      <div class="cart-item">

        <div>

          <b>
            ${item.name}
          </b>

          <br>

          <span style="color:#999">
            ${item.qty} ×
            ${rupiah(item.price)}
          </span>

        </div>


        <div style="text-align:right">

          <b style="color:#00eaff">
            ${rupiah(subtotal)}
          </b>

          <br>

          <button
            class="delete"
            onclick="remove(${index})"
          >
            Hapus
          </button>

        </div>

      </div>

    `;

  });


  document
    .getElementById("total")
    .textContent = rupiah(total);


  document
    .getElementById("count")
    .textContent = count;

}


function filter(category,button){

  currentFilter = category;


  document
    .querySelectorAll(".category")
    .forEach(x =>
      x.classList.remove("active")
    );


  button.classList.add("active");


  if(category === "Semua"){

    showProducts(products);

  }else{

    showProducts(
      products.filter(
        x => x.category === category
      )
    );

  }

}


function searchProducts(){

  const keyword =
    document
      .getElementById("search")
      .value
      .toLowerCase();


  let result =
    products.filter(x =>
      x.name
        .toLowerCase()
        .includes(keyword)
    );


  if(currentFilter !== "Semua"){

    result =
      result.filter(
        x =>
          x.category === currentFilter
      );

  }


  showProducts(result);

}


function goCart(){

  document
    .getElementById("cart")
    .scrollIntoView({

      behavior:"smooth"

    });

}


function checkout(){

  if(cart.length === 0){

    alert(
      "Keranjang masih kosong!"
    );

    return;

  }


  const name =
    document
      .getElementById("name")
      .value
      .trim();


  const phone =
    document
      .getElementById("phone")
      .value
      .trim();


  const note =
    document
      .getElementById("note")
      .value
      .trim();


  const payment =
    document.querySelector(
      'input[name="payment"]:checked'
    );


  if(!name){

    alert(
      "Isi nama terlebih dahulu!"
    );

    return;

  }


  if(!phone){

    alert(
      "Isi nomor WhatsApp terlebih dahulu!"
    );

    return;

  }


  if(!payment){

    alert(
      "Pilih metode pembayaran!"
    );

    return;

  }


  let total = 0;


  const items =
    cart.map(item => {

      const subtotal =
        item.price * item.qty;


      total += subtotal;


      return {

        name:item.name,

        price:item.price,

        qty:item.qty,

        subtotal:subtotal

      };

    });


  const order = {

    name:name,

    phone:phone,

    note:note,

    payment:payment.value,

    items:items,

    total:total,

    date:new Date()
      .toLocaleString("id-ID"),

    status:"Menunggu Pembayaran"

  };


  localStorage.setItem(

    "vinStoreOrder",

    JSON.stringify(order)

  );


  /*
    PINDAH KE PAYMENT.HTML
  */

  window.location.href =
    "payment.html";

}


showProducts(products);

updateCart();

</script>

</body>
      </html>
