<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vin Store</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:
    radial-gradient(circle at 15% 20%,rgba(0,255,255,.16),transparent 30%),
    radial-gradient(circle at 85% 70%,rgba(0,255,255,.12),transparent 30%),
    #050505;
  color:white;
  min-height:100vh;
}

header{
  background:#050505;
  padding:14px;
  display:flex;
  align-items:center;
  gap:10px;
  position:sticky;
  top:0;
  z-index:100;
  box-shadow:0 0 20px rgba(0,255,255,.35);
  border-bottom:1px solid rgba(0,255,255,.2);
}

.logo{
  font-size:20px;
  font-weight:bold;
  color:#fff;
  text-shadow:0 0 10px cyan;
  white-space:nowrap;
}

#search{
  flex:1;
  min-width:0;
  padding:10px 12px;
  border:1px solid rgba(0,255,255,.4);
  border-radius:8px;
  background:#111;
  color:white;
  outline:none;
}

#search::placeholder{
  color:#888;
}

.cart-btn{
  border:0;
  background:#00e5ff;
  color:#000;
  padding:10px 12px;
  border-radius:8px;
  font-weight:bold;
  cursor:pointer;
  box-shadow:0 0 15px rgba(0,255,255,.5);
  white-space:nowrap;
}

.hero{
  text-align:center;
  padding:50px 20px;
  background:
    radial-gradient(circle at center,rgba(0,255,255,.22),transparent 50%),
    linear-gradient(135deg,#020617,#00191f);
  border-bottom:1px solid rgba(0,255,255,.25);
}

.hero h1{
  font-size:32px;
  margin-bottom:10px;
  text-shadow:0 0 15px cyan;
}

.hero p{
  color:#bffcff;
  line-height:1.5;
}

.categories{
  padding:18px 12px;
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:8px;
}

.category{
  padding:9px 15px;
  border:1px solid rgba(0,255,255,.35);
  border-radius:20px;
  background:#0b0b0b;
  color:white;
  cursor:pointer;
}

.category.active,
.category:hover{
  background:#00e5ff;
  color:#000;
  box-shadow:0 0 12px rgba(0,255,255,.5);
}

.products{
  max-width:1100px;
  margin:auto;
  padding:10px 15px 40px;
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:18px;
}

.product{
  background:#0d1117;
  border:1px solid rgba(0,255,255,.2);
  border-radius:15px;
  padding:16px;
  box-shadow:0 5px 20px rgba(0,255,255,.08);
  transition:.2s;
}

.product:hover{
  transform:translateY(-3px);
  box-shadow:0 0 20px rgba(0,255,255,.2);
}

.product-icon{
  height:130px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:65px;
  background:#080b0f;
  border-radius:12px;
  margin-bottom:14px;
}

.product h3{
  font-size:19px;
  margin-bottom:7px;
}

.product p{
  color:#aaa;
  font-size:14px;
  min-height:40px;
  line-height:1.4;
}

.price{
  color:#00e5ff;
  font-size:20px;
  font-weight:bold;
  margin:12px 0;
}

.buy{
  width:100%;
  padding:12px;
  border:0;
  border-radius:9px;
  background:#00e5ff;
  color:#000;
  font-weight:bold;
  cursor:pointer;
}

.buy:hover{
  box-shadow:0 0 15px rgba(0,255,255,.5);
}

.empty{
  grid-column:1/-1;
  text-align:center;
  padding:40px;
  color:#aaa;
}

.cart-panel{
  position:fixed;
  right:-420px;
  top:0;
  width:min(400px,100%);
  height:100vh;
  background:#0b0f14;
  z-index:200;
  padding:20px;
  transition:.3s;
  box-shadow:-5px 0 25px rgba(0,255,255,.2);
  overflow-y:auto;
  border-left:1px solid rgba(0,255,255,.2);
}

.cart-panel.open{
  right:0;
}

.cart-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}

.close{
  background:#222;
  color:white;
  border:0;
  width:35px;
  height:35px;
  border-radius:8px;
  cursor:pointer;
  font-size:18px;
}

.cart-item{
  display:flex;
  justify-content:space-between;
  gap:10px;
  padding:13px 0;
  border-bottom:1px solid #222;
}

.cart-item-name{
  font-weight:bold;
}

.cart-item-price{
  color:#00e5ff;
  margin-top:5px;
}

.qty{
  display:flex;
  align-items:center;
  gap:7px;
  margin-top:8px;
}

.qty button{
  width:27px;
  height:27px;
  border:0;
  border-radius:6px;
  cursor:pointer;
  background:#00e5ff;
  color:#000;
  font-weight:bold;
}

.remove{
  background:#ef4444!important;
  color:white!important;
}

.cart-total{
  margin-top:20px;
  padding:15px;
  background:#111827;
  border-radius:10px;
  font-size:21px;
  font-weight:bold;
}

.checkout{
  width:100%;
  margin-top:15px;
  padding:14px;
  border:0;
  border-radius:9px;
  background:#16a34a;
  color:white;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
}

.overlay{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.65);
  z-index:150;
}

.overlay.show{
  display:block;
}

.checkout-box{
  display:none;
  position:fixed;
  inset:0;
  z-index:300;
  background:rgba(0,0,0,.75);
  align-items:center;
  justify-content:center;
  padding:15px;
}

.checkout-box.show{
  display:flex;
}

.checkout-card{
  width:100%;
  max-width:500px;
  max-height:90vh;
  overflow:auto;
  background:#0d1117;
  border:1px solid rgba(0,255,255,.3);
  border-radius:15px;
  padding:20px;
  box-shadow:0 0 30px rgba(0,255,255,.2);
}

.checkout-card h2{
  margin-bottom:18px;
  text-shadow:0 0 8px cyan;
}

.form-group{
  margin-bottom:13px;
}

.form-group label{
  display:block;
  margin-bottom:6px;
  color:#ccc;
}

.form-group input,
.form-group textarea,
.form-group select{
  width:100%;
  padding:12px;
  border:1px solid #333;
  border-radius:8px;
  background:#111;
  color:white;
  outline:none;
}

.form-group textarea{
  min-height:80px;
  resize:vertical;
}

.summary{
  background:#080b0f;
  padding:12px;
  border-radius:9px;
  margin-bottom:16px;
}

.summary-row{
  display:flex;
  justify-content:space-between;
  padding:6px 0;
  border-bottom:1px solid #222;
}

.summary-row:last-child{
  border-bottom:0;
}

.form-buttons{
  display:flex;
  gap:10px;
  margin-top:15px;
}

.cancel{
  flex:1;
  padding:13px;
  border:0;
  border-radius:8px;
  background:#333;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

.continue{
  flex:2;
  padding:13px;
  border:0;
  border-radius:8px;
  background:#00e5ff;
  color:#000;
  font-weight:bold;
  cursor:pointer;
}

footer{
  text-align:center;
  padding:25px 15px;
  color:#777;
  border-top:1px solid #222;
}

@media(max-width:600px){
  .logo{
    font-size:17px;
  }

  #search{
    width:100%;
  }

  .cart-btn{
    padding:10px 9px;
  }

  .hero h1{
    font-size:27px;
  }

  .products{
    grid-template-columns:repeat(2,1fr);
    gap:10px;
    padding:10px;
  }

  .product{
    padding:11px;
  }

  .product-icon{
    height:100px;
    font-size:48px;
  }

  .product h3{
    font-size:16px;
  }

  .product p{
    font-size:12px;
  }

  .price{
    font-size:17px;
  }

  .buy{
    padding:10px 5px;
    font-size:13px;
  }
}
</style>
</head>

<body>

<header>

  <div class="logo">⚡ VIN STORE</div>

  <input
    type="search"
    id="search"
    placeholder="Cari produk..."
    oninput="searchProducts()"
  >

  <button class="cart-btn" onclick="openCart()">
    🛒 <span id="cartCount">0</span>
  </button>

</header>


<section class="hero">

  <h1>VIN STORE</h1>

  <p>
    Tempat belanja digital dengan proses cepat dan mudah.
  </p>

</section>


<div class="categories">

  <button class="category active" onclick="filterCategory('Semua',this)">
    Semua
  </button>

  <button class="category" onclick="filterCategory('Game',this)">
    🎮 Game
  </button>

  <button class="category" onclick="filterCategory('Top Up',this)">
    💎 Top Up
  </button>

  <button class="category" onclick="filterCategory('Akun',this)">
    👤 Akun
  </button>

  <button class="category" onclick="filterCategory('Lainnya',this)">
    📦 Lainnya
  </button>

</div>


<main class="products" id="products"></main>


<footer>
  © 2026 Vin Store — Semua hak dilindungi.
</footer>


<!-- OVERLAY -->

<div
  class="overlay"
  id="overlay"
  onclick="closeCart()">
</div>


<!-- CART -->

<div class="cart-panel" id="cartPanel">

  <div class="cart-head">

    <h2>🛒 Keranjang</h2>

    <button class="close" onclick="closeCart()">
      ×
    </button>

  </div>

  <div id="cartItems"></div>

  <div class="cart-total">
    Total:
    <span id="cartTotal">Rp0</span>
  </div>

  <button class="checkout" onclick="openCheckout()">
    💳 Checkout
  </button>

</div>


<!-- CHECKOUT -->

<div class="checkout-box" id="checkoutBox">

  <div class="checkout-card">

    <h2>📦 Checkout</h2>

    <div class="summary" id="checkoutSummary"></div>

    <div class="form-group">

      <label>Nama</label>

      <input
        type="text"
        id="customerName"
        placeholder="Masukkan nama"
      >

    </div>


    <div class="form-group">

      <label>Nomor WhatsApp</label>

      <input
        type="tel"
        id="customerPhone"
        placeholder="08xxxxxxxxxx"
      >

    </div>


    <div class="form-group">

      <label>Metode Pembayaran</label>

      <select id="paymentMethod">

        <option value="DANA">DANA</option>

        <option value="GoPay">GoPay</option>

        <option value="OVO">OVO</option>

        <option value="QRIS">QRIS</option>

      </select>

    </div>


    <div class="form-group">

      <label>Catatan</label>

      <textarea
        id="customerNote"
        placeholder="Catatan pesanan (opsional)"
      ></textarea>

    </div>


    <div class="form-buttons">

      <button class="cancel" onclick="closeCheckout()">
        Batal
      </button>

      <button class="continue" onclick="createOrder()">
        Lanjut Pembayaran →
      </button>

    </div>

  </div>

</div>


<script>

/* ==============================
   DATA PRODUK
   ============================== */

const products = [

  {
    id:1,
    name:"Diamond Mobile Legends",
    category:"Top Up",
    price:10000,
    icon:"💎",
    description:"Top up diamond Mobile Legends."
  },

  {
    id:2,
    name:"Diamond Free Fire",
    category:"Top Up",
    price:10000,
    icon:"🔥",
    description:"Top up diamond Free Fire."
  },

  {
    id:3,
    name:"Robux Roblox",
    category:"Game",
    price:15000,
    icon:"🟥",
    description:"Produk Robux Roblox."
  },

  {
    id:4,
    name:"Akun Mobile Legends",
    category:"Akun",
    price:50000,
    icon:"🎮",
    description:"Akun game sesuai stok."
  },

  {
    id:5,
    name:"Jasa Joki Game",
    category:"Game",
    price:20000,
    icon:"🏆",
    description:"Jasa bantuan push rank."
  },

  {
    id:6,
    name:"Produk Digital",
    category:"Lainnya",
    price:10000,
    icon:"📦",
    description:"Produk digital Vin Store."
  }

];


let cart =
  JSON.parse(localStorage.getItem("vinStoreCart")) || [];

let currentCategory="Semua";


/* ==============================
   RUPIAH
   ============================== */

function rupiah(number){

  return "Rp"+
    Number(number).toLocaleString("id-ID");

}


/* ==============================
   TAMPIL PRODUK
   ============================== */

function renderProducts(){

  const box =
    document.getElementById("products");

  const search =
    document.getElementById("search")
    .value
    .toLowerCase()
    .trim();

  const filtered =
    products.filter(product=>{

      const matchCategory =
        currentCategory==="Semua" ||
        product.category===currentCategory;

      const matchSearch =
        product.name.toLowerCase()
        .includes(search);

      return matchCategory && matchSearch;

    });


  if(filtered.length===0){

    box.innerHTML=`
      <div class="empty">
        Produk tidak ditemukan.
      </div>
    `;

    return;

  }


  box.innerHTML =
    filtered.map(product=>`

      <div class="product">

        <div class="product-icon">
          ${product.icon}
        </div>

        <h3>${product.name}</h3>

        <p>
          ${product.description}
        </p>

        <div class="price">
          ${rupiah(product.price)}
        </div>

        <button
          class="buy"
          onclick="addToCart(${product.id})">

          🛒 Tambah ke Keranjang

        </button>

      </div>

    `).join("");

}


/* ==============================
   CARI
   ============================== */

function searchProducts(){

  renderProducts();

}


/* ==============================
   FILTER
   ============================== */

function filterCategory(category,button){

  currentCategory=category;

  document.querySelectorAll(".category")
    .forEach(btn=>{
      btn.classList.remove("active");
    });

  button.classList.add("active");

  renderProducts();

}


/* ==============================
   TAMBAH KERANJANG
   ============================== */

function addToCart(id){

  const product =
    products.find(p=>p.id===id);

  if(!product)return;


  const existing =
    cart.find(item=>item.id===id);


  if(existing){

    existing.qty++;

  }else{

    cart.push({
      id:product.id,
      name:product.name,
      price:product.price,
      qty:1
    });

  }


  saveCart();

  updateCart();

  alert(product.name+" ditambahkan ke keranjang!");

}


/* ==============================
   SIMPAN KERANJANG
   ============================== */

function saveCart(){

  localStorage.setItem(
    "vinStoreCart",
    JSON.stringify(cart)
  );

}


/* ==============================
   UPDATE KERANJANG
   ============================== */

function updateCart(){

  const count =
    cart.reduce(
      (total,item)=>total+item.qty,
      0
    );

  document.getElementById("cartCount")
    .textContent=count;


  const box =
    document.getElementById("cartItems");


  if(cart.length===0){

    box.innerHTML=`
      <p style="color:#888;text-align:center;padding:30px 0">
        Keranjang masih kosong.
      </p>
    `;

    document.getElementById("cartTotal")
      .textContent="Rp0";

    return;

  }


  let total=0;


  box.innerHTML =
    cart.map((item,index)=>{

      const subtotal =
        item.price*item.qty;

      total+=subtotal;


      return `

        <div class="cart-item">

          <div>

            <div class="cart-item-name">
              ${item.name}
            </div>

            <div class="cart-item-price">
              ${rupiah(item.price)}
            </div>

            <div class="qty">

              <button
                onclick="changeQty(${index},-1)">
                −
              </button>

              <span>
                ${item.qty}
              </span>

              <button
                onclick="changeQty(${index},1)">
                +
              </button>

              <button
                class="remove"
                onclick="removeCart(${index})">
                ×
              </button>

            </div>

          </div>

          <strong>
            ${rupiah(subtotal)}
          </strong>

        </div>

      `;

    }).join("");


  document.getElementById("cartTotal")
    .textContent=rupiah(total);

}


/* ==============================
   UBAH JUMLAH
   ============================== */

function changeQty(index,amount){

  if(!cart[index])return;

  cart[index].qty += amount;


  if(cart[index].qty<=0){

    cart.splice(index,1);

  }


  saveCart();

  updateCart();

}


/* ==============================
   HAPUS
   ============================== */

function removeCart(index){

  cart.splice(index,1);

  saveCart();

  updateCart();

}


/* ==============================
   BUKA CART
   ============================== */

function openCart(){

  document.getElementById("cartPanel")
    .classList.add("open");

  document.getElementById("overlay")
    .classList.add("show");

}


/* ==============================
   TUTUP CART
   ============================== */

function closeCart(){

  document.getElementById("cartPanel")
    .classList.remove("open");

  document.getElementById("overlay")
    .classList.remove("show");

}


/* ==============================
   CHECKOUT
   ============================== */

function openCheckout(){

  if(cart.length===0){

    alert("Keranjang masih kosong!");

    return;

  }


  let total=0;


  const summary =
    document.getElementById("checkoutSummary");


  summary.innerHTML =
    cart.map(item=>{

      const subtotal =
        item.price*item.qty;

      total+=subtotal;


      return `

        <div class="summary-row">

          <span>
            ${item.name} × ${item.qty}
          </span>

          <b>
            ${rupiah(subtotal)}
          </b>

        </div>

      `;

    }).join("");


  summary.innerHTML += `

    <div
      class="summary-row"
      style="font-size:19px;margin-top:8px">

      <b>Total</b>

      <b>
        ${rupiah(total)}
      </b>

    </div>

  `;


  document.getElementById("checkoutBox")
    .classList.add("show");


  closeCart();

}


/* ==============================
   TUTUP CHECKOUT
   ============================== */

function closeCheckout(){

  document.getElementById("checkoutBox")
    .classList.remove("show");

}


/* ==============================
   BUAT PESANAN
   ============================== */

function createOrder(){

  const name =
    document.getElementById("customerName")
    .value.trim();

  const phone =
    document.getElementById("customerPhone")
    .value.trim();

  const payment =
    document.getElementById("paymentMethod")
    .value;

  const note =
    document.getElementById("customerNote")
    .value.trim();


  if(!name){

    alert("Nama belum diisi!");

    return;

  }


  if(!phone){

    alert("Nomor WhatsApp belum diisi!");

    return;

  }


  let total=0;


  const items =
    cart.map(item=>{

      const subtotal =
        item.price*item.qty;

      total+=subtotal;


      return {

        id:item.id,

        name:item.name,

        price:item.price,

        qty:item.qty,

        subtotal:subtotal

      };

    });


  const order={

    id:"VIN"+
      Date.now(),

    name:name,

    phone:phone,

    note:note,

    payment:payment,

    items:items,

    total:total,

    status:"Menunggu Pembayaran",

    createdAt:
      new Date().toLocaleString("id-ID")

  };


  /* SIMPAN PESANAN */

  localStorage.setItem(
    "vinStoreOrder",
    JSON.stringify(order)
  );


  /* KOSONGKAN KERANJANG */

  cart=[];

  saveCart();


  /* PINDAH KE PAYMENT */

  window.location.href="payment.html";

}


/* ==============================
   LOAD
   ============================== */

renderProducts();

updateCart();

</script>

</body>
  </html>
