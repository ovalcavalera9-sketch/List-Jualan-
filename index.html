<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vin Store</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f6fa;
      color: #222;
    }

    header {
      background: #111827;
      color: white;
      padding: 15px;
      display: flex;
      align-items: center;
      gap: 15px;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .logo {
      font-size: 22px;
      font-weight: bold;
      white-space: nowrap;
    }

    #search {
      flex: 1;
      padding: 11px;
      border: none;
      border-radius: 8px;
      outline: none;
    }

    .cart-btn {
      background: #2563eb;
      color: white;
      border: none;
      padding: 10px 14px;
      border-radius: 8px;
      cursor: pointer;
    }

    .hero {
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      color: white;
      padding: 45px 20px;
      text-align: center;
    }

    .hero h1 {
      font-size: 32px;
      margin-bottom: 10px;
    }

    .hero p {
      font-size: 17px;
    }

    .categories {
      display: flex;
      justify-content: center;
      gap: 10px;
      padding: 20px;
      flex-wrap: wrap;
    }

    .category-btn {
      border: none;
      padding: 10px 17px;
      border-radius: 20px;
      background: white;
      cursor: pointer;
      box-shadow: 0 2px 8px #ddd;
    }

    .category-btn.active {
      background: #2563eb;
      color: white;
    }
